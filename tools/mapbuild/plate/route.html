<!doctype html>
<meta charset="utf-8">
<title>route plate</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>html,body,#m{margin:0;width:100%;height:100%;background:#000}.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}
#t{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.93);padding:6px 10px;font:14px/1.35 sans-serif;color:#111;z-index:9;max-width:70%;white-space:pre-wrap}</style>
<div id="m"></div><div id="t"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Two or more routes over our own base tiles, to see which one is right. One-way arrows come from the tiles' oneway field.
// window.__job: { tiles, lines:[{coords, color, width, dash}], points:[{lon, lat, label, color}], box:[minLon,minLat,maxLon,maxLat] or center+zoom, title }
const J = window.__job;
document.getElementById('t').textContent = J.title || '';
const rtl = maplibregl.setRTLTextPlugin('https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js', false);
if (rtl && rtl.catch) rtl.catch(e => { window.__rtlErr = String(e); });
const nm = ['coalesce', ['get', 'name:en'], ['get', 'name:latin'], ['get', 'name'], ['get', 'name:ar']];
const zw = (...s) => ['interpolate', ['exponential', 1.5], ['zoom'], ...s];
const road = (id, cls, color, stops, extra = {}) => ({ id, type: 'line', source: 'omt', 'source-layer': 'transportation', filter: ['in', ['get', 'class'], ['literal', cls]], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': color, 'line-width': zw(...stops) }, ...extra });
const src = { omt: { type: 'vector', tiles: [J.tiles], minzoom: 0, maxzoom: 14 } };
const layers = [
  { id: 'bg', type: 'background', paint: { 'background-color': '#f4f1ea' } },
  { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-color': '#b5d3e7' } },
  { id: 'park', type: 'fill', source: 'omt', 'source-layer': 'park', paint: { 'fill-color': '#d8e8c8' } },
  { id: 'bld', type: 'fill', source: 'omt', 'source-layer': 'building', minzoom: 14, paint: { 'fill-color': '#e2ddd2' } },
  road('svc', ['service', 'track'], '#bdb7a8', [12, .3, 15, 1.2, 18, 5]),
  road('min', ['minor'], '#ffffff', [11, .4, 15, 2.4, 18, 10]),
  road('ter', ['tertiary'], '#ffffff', [10, .6, 15, 3.5, 18, 13]),
  road('sec', ['secondary'], '#fbe7b0', [9, .7, 15, 4.5, 18, 16]),
  road('pri', ['primary'], '#f7cf7e', [8, .8, 15, 5.5, 18, 20]),
  road('mot', ['motorway', 'trunk'], '#ec9e5a', [7, 1.2, 15, 7, 18, 26]),
  { id: 'oneway', type: 'symbol', source: 'omt', 'source-layer': 'transportation', minzoom: 14, filter: ['==', ['get', 'oneway'], 1],
    layout: { 'symbol-placement': 'line', 'symbol-spacing': 90, 'text-field': '→', 'text-font': ['Noto Sans Bold'], 'text-size': 14, 'text-keep-upright': false, 'text-allow-overlap': true }, paint: { 'text-color': '#6b5a3a', 'text-halo-color': '#fff', 'text-halo-width': 1 } },
  { id: 'rname', type: 'symbol', source: 'omt', 'source-layer': 'transportation_name', minzoom: 11, layout: { 'symbol-placement': 'line', 'text-field': nm, 'text-font': ['Noto Sans Regular'], 'text-size': 12, 'text-max-angle': 30, 'text-padding': 20 }, paint: { 'text-color': '#333', 'text-halo-color': '#fff', 'text-halo-width': 1.4 } },
];
(J.lines || []).forEach((l, i) => {
  src['l' + i] = { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: l.coords } } };
  const paint = { 'line-color': l.color, 'line-width': l.width || 5, 'line-opacity': l.opacity || .8 };
  if (l.dash) paint['line-dasharray'] = l.dash;
  layers.push({ id: 'line' + i, type: 'line', source: 'l' + i, layout: l.dash ? {} : { 'line-cap': 'round', 'line-join': 'round' }, paint });
});
if (J.points && J.points.length) {
  src.pts = { type: 'geojson', data: { type: 'FeatureCollection', features: J.points.map(p => ({ type: 'Feature', properties: { label: p.label || '', color: p.color || '#000' }, geometry: { type: 'Point', coordinates: [p.lon, p.lat] } })) } };
  layers.push({ id: 'pts', type: 'circle', source: 'pts', paint: { 'circle-radius': 6, 'circle-color': ['get', 'color'], 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  layers.push({ id: 'plabel', type: 'symbol', source: 'pts', layout: { 'text-field': ['get', 'label'], 'text-font': ['Noto Sans Bold'], 'text-size': 13, 'text-anchor': 'bottom', 'text-offset': [0, -.6], 'text-allow-overlap': true }, paint: { 'text-color': '#000', 'text-halo-color': '#fff', 'text-halo-width': 2 } });
}
const style = { version: 8, glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf', sources: src, layers };
const map = new maplibregl.Map({ container: 'm', style, center: J.center || [50.2, 26.3], zoom: J.zoom || 12, attributionControl: false, canvasContextAttributes: { preserveDrawingBuffer: true, antialias: true }, fadeDuration: 0, pixelRatio: 1, interactive: false });
const errors = [];
map.on('error', e => errors.push(e.error && e.error.message));
map.on('load', () => {
  if (J.box) map.fitBounds([[J.box[0], J.box[1]], [J.box[2], J.box[3]]], { padding: 50, duration: 0, maxZoom: J.maxZoom || 17 });
  map.once('idle', () => setTimeout(() => { window.__info = { zoom: map.getZoom(), center: map.getCenter(), rtl: maplibregl.getRTLTextPluginStatus(), errors }; window.__ready = true; }, 300));
});
</script>
