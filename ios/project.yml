name: Amri
options:
  bundleIdPrefix: com.abdllh
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
packages:
  AMRIKit:
    path: AMRIKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  Amri:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: AMRIKit
      - target: AmriShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdllh.amri
        PRODUCT_NAME: Amri
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/App-Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [AmriUITests]
  AmriShare:
    type: app-extension
    platform: iOS
    sources: [ShareExt, Shared]
    dependencies:
      - package: AMRIKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdllh.amri.share
        PRODUCT_NAME: AmriShare
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Share-Info.plist
        CODE_SIGN_STYLE: Automatic
  AmriUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Amri
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdllh.amri.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
